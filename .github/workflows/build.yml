# Costruisce chatStorm per Mac (Apple Silicon e Intel), ognuno su un Mac del suo tipo, e prova che l'app parta.
# - a mano (Run workflow) o con un push sul ramo prova-build: i .dmg restano tra gli "artifact" della prova
# - con un tag v1.2.3: i .dmg vengono pubblicati come Release, da dove li scarica il pulsante sul sito
# - con un tag v1.2.3-prova1: come sopra, ma segnata come pre-release (non diventa "l'ultima versione")
name: App per Mac

on:
  workflow_dispatch:
  push:
    branches: [prova-build]
    tags: ['v*']

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
          - arch: x64
            os: macos-15-intel
    name: dmg ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: La versione del tag coincide con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME%%-*}"
      - name: Dipendenze
        run: npm install --no-audit --no-fund
      - name: Costruisce l'app
        run: bash mac/build-dmg.sh ${{ matrix.arch }}
      - name: Prova di avvio
        run: bash mac/prova-app.sh dist/chatStorm-darwin-${{ matrix.arch }}/chatStorm.app
      - uses: actions/upload-artifact@v4
        with:
          name: chatStorm-${{ matrix.arch }}
          path: dist/chatStorm-${{ matrix.arch }}.dmg
          retention-days: 14
          compression-level: 0

  release:
    name: Pubblica la Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # un tag come v1.2.3-prova1 diventa una "pre-release": si scarica, ma non è la versione ufficiale
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/chatStorm-arm64.dmg dist/chatStorm-x64.dmg --prerelease \
              --title "chatStorm ${GITHUB_REF_NAME#v} (versione di prova)" \
              --notes "Versione di prova, non ancora ufficiale. Serve a verificare il download e l'installazione."
          else
            gh release create "$GITHUB_REF_NAME" dist/chatStorm-arm64.dmg dist/chatStorm-x64.dmg \
              --title "chatStorm ${GITHUB_REF_NAME#v}" --notes-file mac/NOTE-RILASCIO.md
          fi
