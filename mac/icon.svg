<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7BEF"/>
      <stop offset=".55" stop-color="#1846B8"/>
      <stop offset="1" stop-color="#0A2558"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".12" r=".75">
      <stop offset="0" stop-color="#7CCBFF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#7CCBFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDEEFF"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FB4FA"/>
      <stop offset="1" stop-color="#2B86EE"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F57E0"/>
      <stop offset="1" stop-color="#143C9F"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC0FF"/><stop offset="1" stop-color="#1F57E0"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FD6E8"/><stop offset="1" stop-color="#2196C9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#020B22" flood-opacity=".55"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- fondo: spazio blu -->
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <g fill="#BFE3FF" opacity=".5">
      <circle cx="232" cy="236" r="5"/><circle cx="790" cy="300" r="4"/><circle cx="210" cy="720" r="4"/>
      <circle cx="815" cy="760" r="6"/><circle cx="330" cy="170" r="3"/>
    </g>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="3"/>

  <!-- cubo: ogni faccia è una mappa -->
  <g filter="url(#shadow)">
    <path d="M296 440 512 565 512 800 296 675Z" fill="url(#left)"/>
    <path d="M512 565 728 440 728 675 512 800Z" fill="url(#right)"/>
    <path d="M512 315 728 440 512 565 296 440Z" fill="url(#top)"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="5" stroke-linejoin="round">
    <path d="M512 315 728 440 512 565 296 440Z"/>
    <path d="M512 565V800"/>
  </g>

  <!-- sulla faccia superiore: due chat collegate -->
  <g transform="matrix(216 -125 216 125 296 440)">
    <path d="M.33 .33 C .48 .36 .52 .64 .67 .67" fill="none" stroke="#5F7DB8" stroke-width=".022" stroke-linecap="round"/>
    <rect x=".14" y=".16" width=".28" height=".28" rx=".07" fill="url(#tileA)"/>
    <rect x=".58" y=".56" width=".28" height=".28" rx=".07" fill="url(#tileB)"/>
  </g>

  <!-- faccia sinistra: righe di una conversazione -->
  <g transform="matrix(216 125 0 235 296 440)" fill="#FFFFFF">
    <rect x=".16" y=".2" width=".56" height=".09" rx=".04" opacity=".9"/>
    <rect x=".16" y=".38" width=".4" height=".09" rx=".04" opacity=".7"/>
    <rect x=".16" y=".56" width=".5" height=".09" rx=".04" opacity=".5"/>
  </g>
</svg>
